[package]
name = "hocuspocus-storage"
description = "Persistence backends (SQLite, Postgres, S3) for Hocuspocus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]
object = ["dep:object_store"]
s3 = ["object", "object_store/aws"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
hocuspocus-core = { workspace = true }
object_store = { version = "0.14", optional = true, default-features = false }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio-rustls"] }

[dev-dependencies]
tokio = { workspace = true }
