[package]
name = "hocuspocus-redis"
description = "Redis horizontal scaling for Hocuspocus, interoperable with @hocuspocus/extension-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
hocuspocus-core = { workspace = true }
hocuspocus-protocol = { workspace = true }
redis = { version = "1", default-features = false, features = ["tokio-comp", "script"] }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }
