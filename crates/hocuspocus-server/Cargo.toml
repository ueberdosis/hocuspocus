[package]
name = "hocuspocus-server"
description = "Standalone Hocuspocus collaboration server binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hocuspocus-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
figment = { workspace = true }
hocuspocus-axum = { workspace = true }
hocuspocus-core = { workspace = true }
hocuspocus-protocol = { workspace = true }
hocuspocus-storage = { workspace = true, features = ["sqlite", "postgres"] }
hocuspocus-webhook = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
